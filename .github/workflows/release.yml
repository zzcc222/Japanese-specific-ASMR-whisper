name: Create Release v3.2

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release v3.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## ASMR Whisper Studio v3.2

          专为日语同人音声（ASMR）与影视打造的本地 AI 语音识别与硬字幕压制工作站。  
          Local AI Speech-to-Text & Hardsub Studio for Japanese ASMR & Videos.

          ---

          ### 🇨🇳 v3.2 更新内容
          - **字幕切分引擎重构（原生时间戳 + 标点自然断句 + 最大时长弹性控制）**：彻底剥离重型第三方分词器（`Janome` / `BudouX`），消除生硬的机械碎句；全面回归 **Whisper 原生段落时间戳 (`seg_break`) + 标点符号优先断句（`。！？…、，`）+ 单句最大时长滑块弹性控制**，兼顾日系 ASMR、AV、动漫与影视剧的自然语感与翻译通顺度。
          - **防幻觉与转录设置界面精简**：将防幻觉高级设置精简为核心「2 个开关 + 1 个滑块」（**彻底隔离前文依赖**、**过滤独立纯拟音**、**单句最大时长截断滑块**），其余防复读压缩率阈值、标点断句与相邻重复去重全面转为底层内置默认开启，界面更加清爽直观。
          - **折叠抽屉动画残影修复**：重构折叠卡片（`CollapsibleCard`）视口裁剪机制与滚动区背景渲染，彻底解决展开/收起防幻觉设置与 VAD 面板时的控件挤压与残影拖影问题。
          - **运行时依赖瘦身**：移除 `janome` 与 `budoux` 依赖包，固化 44 个核心 Windows x64 运行时依赖，启动更快、运行更轻量。

          ---

          ### 🇬🇧 v3.2 Release Notes
          - **Native Timestamp & Punctuation-First Segmentation Engine**: Removed heavy third-party morphological tokenizers (`Janome` / `BudouX`) that caused over-fragmented clauses. Restored a clean **Whisper native segment boundary (`seg_break`) + punctuation-first splitting (`。！？…、，`) + elastic max-duration slider** pipeline for natural subtitle pacing across ASMR, AV, anime, and drama videos.
          - **Streamlined Anti-Hallucination Settings UI**: Simplified the advanced R18 ASMR panel to 2 essential toggles (**Isolate Previous Context**, **Filter Standalone Moans**) and 1 **Max Segment Duration Slider**, while keeping compression ratio checks, punctuation splitting, and adjacent deduplication active by default in the backend.
          - **Collapsible Drawer Anti-Ghosting Fix**: Refactored `CollapsibleCard` viewport clipping and scroll-area background painting to eliminate visual ghosting and widget squishing during expand/collapse animations.
          - **Lighter Runtime Footprint**: Removed `janome` and `budoux` from the frozen dependency lockfile (44 verified packages).

          ---

          ### 📦 安装说明 / Installation
          1. 下载下方 **`ASMR-Whisper-Studio-Setup(3.2).exe`** 并运行安装（内置 Python 与 FFmpeg 环境，开箱即用）。
          2. 将 Whisper 模型文件夹（如 `large-v3`、`large-v3-turbo`）放入安装目录下的 `Model/` 文件夹即可离线使用。
          EOF
          gh release view v3.2 || gh release create v3.2 --title "ASMR Whisper Studio v3.2" --notes-file release_notes.md --target main
